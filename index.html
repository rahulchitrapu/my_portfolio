<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rahul Chitrapu — Software Engineer &amp; Full-Stack Web Developer</title>
    <meta
      name="description"
      content="Rahul Chitrapu is a Software Engineer with 4+ years of experience building full-stack web applications with React, Python, AI-powered workflows, and real-time features."
    />
    <meta name="author" content="Rahul Chitrapu" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6f3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0e10" />

    <!-- Open Graph / social previews -->
    <meta property="og:type" content="profile" />
    <meta property="profile:first_name" content="Rahul" />
    <meta property="profile:last_name" content="Chitrapu" />
    <meta property="og:site_name" content="Rahul Chitrapu" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Rahul Chitrapu — Software Engineer &amp; Full-Stack Web Developer" />
    <meta
      property="og:description"
      content="Full-stack web applications, AI-powered workflows, and real-time features built with React and Python."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rahul Chitrapu — Software Engineer &amp; Full-Stack Web Developer" />
    <meta
      name="twitter:description"
      content="Full-stack web applications, AI-powered workflows, and real-time features built with React and Python."
    />
    <!-- Canonical URL, og:url, social image and JSON-LD are injected at build time by scripts/prerender.js -->
    <!--app-head-->

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
    />

    <!-- Apply saved theme and enable reveal animations before first paint -->
    <script>
      ;(function () {
        var root = document.documentElement
        root.classList.add('js')
        try {
          var theme = localStorage.getItem('theme')
          if (theme === 'light' || theme === 'dark') root.dataset.theme = theme
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
